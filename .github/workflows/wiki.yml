name: Publish player wiki

on:
  push:
    branches: [main]
    paths: ['docs/**', 'tools/wiki/**', 'src/main/**', 'gradle.properties', '.github/workflows/wiki.yml']
  pull_request:
    paths: ['docs/**', 'tools/wiki/**', 'src/main/**', 'gradle.properties', '.github/workflows/wiki.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/wiki/requirements.txt
      - run: python -m pip install -r tools/wiki/requirements.txt
      - name: Test languages and historical editions
        run: python -m unittest discover -s tools/wiki -p 'test_*.py'
      - name: Build and validate wiki
        run: python tools/wiki/build.py
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/wiki
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy wiki
        id: deployment
        uses: actions/deploy-pages@v4
